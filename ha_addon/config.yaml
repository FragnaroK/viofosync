name: Viofosync
version: "latest"
slug: viofosync
description: Sync and browse Viofo dashcam recordings
url: https://github.com/FragnaroK/viofosync
arch:
  - amd64
  - aarch64
init: false
options:
  disable_auth: true
schema:
  disable_auth: bool
startup: application
boot: auto
# Reaching the dashcam over its Wi-Fi AP needs the host network.
host_network: true
# Config in /config, recordings in HA's media share at /recordings.
map:
  - type: addon_config
    path: /config
    read_only: false
  - type: media
    path: /recordings
    read_only: false
# Web UI embedded in the HA sidebar via ingress (served on 8080).
ingress: true
ingress_port: 8080
panel_icon: mdi:car-back
panel_title: Viofosync
# Direct access stays available on the host network.
webui: "http://[HOST]:[PORT:8080]"
watchdog: "http://[HOST]:[PORT:8080]/healthz"
# Uncomment for Intel iGPU hardware-accelerated exports.
# devices:
#   - /dev/dri/renderD128
