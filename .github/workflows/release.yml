name: Release add-on

# Tag vX.Y.Z -> publish ghcr.io/<owner>/viofosync:X.Y.Z, then bump the add-on
# version and base image tag on ADDON_BRANCH so Home Assistant offers an Update.
on:
  push:
    tags: ["v[0-9]*"]

env:
  ADDON_BRANCH: feature/ha-app
  IMAGE: ghcr.io/fragnarok/viofosync

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:ha-app
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.ADDON_BRANCH }}
      - name: Point the add-on at the new version
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          sed -i -E "s|^version: .*|version: \"${VERSION}\"|" ha_addon/config.yaml
          sed -i -E "s|^FROM .*|FROM ${IMAGE}:${VERSION}|" ha_addon/Dockerfile
      - name: Commit
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ha_addon/config.yaml ha_addon/Dockerfile
          git diff --cached --quiet || git commit -m "Release add-on ${VERSION}"
          git push origin "HEAD:${ADDON_BRANCH}"
